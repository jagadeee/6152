services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-docker-demo:latest
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

